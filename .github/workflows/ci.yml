name: CI

# Fast Trunk (Agent-native):
# - Aggregate source verdict: source-ci/pass
# - CI = source correctness only; Platform builds production once
# - Merge Queue off by default (no merge_group trigger)
# - Concurrency cancels superseded PR/branch tip runs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  # Fast Trunk: supersede obsolete runs for the same PR or branch tip.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: sylphx-linux-standard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Enforce owned CI runner profiles
        run: python3 .github/scripts/check-owned-runner-profiles.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build and test Rust decode core
        run: cargo test --release

      - name: Check code quality
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Build package
        run: bun run build

      - name: Run tests
        run: bun test

      - name: Release gate
        run: bun run benchmark:release-gate
