name: Release

# The reusable Sylphx publisher is the only release authority. It materializes
# and audits the candidate tarball before npm publish, so a direct
# `changeset publish` shortcut cannot leak into a public package release.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  actions: write
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    uses: SylphxAI/.github/.github/workflows/publish-npm.yml@main
    with:
      build-command: bun run build
      test-command: >-
        bun run typecheck && bun run check && bun test && cargo test --workspace
        && bun run benchmark:release-gate
      version-command: bun run version-packages
      publish-command: auto
      create-github-releases: true
    secrets: inherit
